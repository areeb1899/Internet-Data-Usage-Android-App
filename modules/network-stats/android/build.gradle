apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.networkstats'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()

android {
  compileSdkVersion Integer.parseInt(rootProject.ext.has("compileSdkVersion") ? "${rootProject.ext.compileSdkVersion}" : "35")

  defaultConfig {
    minSdkVersion Integer.parseInt(rootProject.ext.has("minSdkVersion") ? "${rootProject.ext.minSdkVersion}" : "24")
    targetSdkVersion Integer.parseInt(rootProject.ext.has("targetSdkVersion") ? "${rootProject.ext.targetSdkVersion}" : "35")
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
  publishing {
    singleVariant("release") {
      withSourcesJar()
    }
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib"
}
